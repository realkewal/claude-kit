# Claude Code status line configuration.
#
# This file is sourced by statusline.sh as plain bash, so it is shell syntax:
# NAME=value, no spaces around "=", quote anything containing spaces.
# Delete or comment out any line to fall back to the built-in default.
#
# Lookup order: $CLAUDE_STATUSLINE_CONF, then ~/.claude/statusline.conf,
# then a statusline.conf sitting next to the script. First match wins.

# ------------------------------------------------------------------ layout ---
BAR_WIDTH=20            # cells per bar; all bars share this width
LABEL_WIDTH=7           # label column width, counted in bytes (keep labels ASCII)
SHOW_SPACERS=1          # 1 = blank row between each bar, 0 = packed together

# -------------------------------------------------------------- which bars ---
SHOW_SESSION=1          # 5-hour rate limit
SHOW_WEEK=1             # 7-day rate limit
SHOW_CONTEXT=1          # context window

# --------------------------------------------------- header line segments ---
SHOW_MODES=1            # effort level, thinking, fast mode, output style
SHOW_DIR=1              # working directory
SHOW_GIT=1              # branch and dirty marker
SHOW_CHURN=1            # lines Claude added/removed this session
SHOW_COST=1             # session spend in USD

# -------------------------------------------------------- notes after bars ---
SHOW_RESETS=1           # "resets in 4h 31m"
SHOW_PACE=1             # "on pace for 41%" projection on the session bar
SHOW_TOKENS=1           # "41k / 1.0M" on the context bar
PACE_MIN_ELAPSED=1200   # seconds into a window before the projection appears
SESSION_WINDOW=18000    # length of the session rate-limit window, in seconds

# -------------------------------------------------------------- thresholds ---
WARN_PCT=60             # bar turns amber at or above this
DANGER_PCT=85           # bar turns red and gains the cue at or above this
DANGER_CUE="! "         # shown before the percentage past DANGER_PCT, so the
                        # alarm is not carried by colour alone. Its width is
                        # reserved on every row, so columns stay aligned.

# ------------------------------------------------------------- performance ---
GIT_CACHE_TTL=3         # seconds to reuse cached git state. Higher is cheaper
                        # in big repos; a fresh edit can show stale for this long.

# ----------------------------------------------------------- auto-compact ---
# Percentage of the context window at which auto-compaction fires, drawn as a
# tick on the context bar. Claude Code resolves its "auto" window internally and
# does not report it, so leave this empty unless you have pinned a window via
# /config or CLAUDE_AUTOCOMPACT_PCT_OVERRIDE. Empty means no tick is drawn.
COMPACT_PCT=""

# ------------------------------------------------------------------ glyphs ---
BAR_FILL="█"
BAR_EMPTY="░"
BAR_MARK="┊"            # the auto-compact tick
SEP=" | "               # between header segments
MODE_SEP=" · "          # between mode flags, and between churn and cost

LABEL_SESSION="Session"
LABEL_WEEK="Week"
LABEL_CONTEXT="Context"

# ----------------------------------------------------------------- colours ---
# Raw SGR parameters, without the escape or the trailing "m".
#   30-37 / 90-97  basic ANSI, follows the terminal theme (recommended)
#   38;5;N         fixed 256-colour index
#   38;2;R;G;B     24-bit truecolour
#   1;33           attribute plus colour
#   ""             no colour
#
# Note on the greys: ANSI dim (SGR 2) is deliberately not used anywhere. Many
# terminals render it at roughly 40% opacity, which fails contrast on both light
# and dark themes. Explicit greys are legible on both.
COLOR_MODEL="36"
COLOR_DIR="32"
COLOR_GIT="35"
COLOR_TEXT="38;5;245"   # labels, reset times, notes
COLOR_TROUGH="38;5;238" # unfilled bar cells (decorative, carries no meaning)
COLOR_MARK="38;5;250"   # auto-compact tick
COLOR_OK="32"
COLOR_WARN="33"
COLOR_DANGER="31"
